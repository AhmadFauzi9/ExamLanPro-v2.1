<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Log - ExamLAN Pro</title>
    <!-- Local Vendor Assets (100% Offline LAN) -->
    <script src="../../assets/vendor/tailwind/tailwind.js"></script>
    <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../assets/vendor/fonts/inter.css">
    <link rel="stylesheet" href="../assets/css/guru.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
                            500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col m-0 p-0 overflow-x-hidden">

    <!-- Modular Navbar Component -->
    <div id="navbar-placeholder"></div>

    <!-- Main Container -->
    <main class="flex-grow w-full px-4 sm:px-6 lg:px-8 py-5">
        <div class="grid grid-cols-1 md:grid-cols-[230px_minmax(0,1fr)] gap-5 items-start">
            
            <!-- Modular Sidebar Component -->
            <div id="sidebar-placeholder" class="sticky top-20 z-20"></div>

            <!-- Content Area: AUDIT LOG -->
            <div class="space-y-4 min-w-0">
                
                <!-- Page Header Card -->
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 border border-purple-100 flex items-center justify-center text-lg font-bold">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <div>
                            <h2 class="font-bold text-slate-800 text-sm sm:text-base leading-tight">Rekam Jejak Sistem (Audit Log)</h2>
                            <p class="text-[11px] text-slate-500 mt-0.5">Catatan aktivitas administratif, keamanan, autentikasi, dan perubahan data sistem.</p>
                        </div>
                    </div>
                </div>

                <!-- Filters & Search Card -->
                <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-3 text-xs">
                    <!-- Left: View -> Sort -> Search Group -->
                    <div class="flex items-center gap-2 flex-wrap flex-1 min-w-0">
                        <!-- 1. View (Numeric) default 20 -->
                        <select id="audit-per-page" onchange="changeAuditPerPage(this.value)" class="px-2.5 py-1.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-700 outline-none" title="Jumlah Baris Tampil">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="30">30</option>
                            <option value="40">40</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>

                        <!-- 2. Sort (Urutkan) -->
                        <select id="audit-sort" onchange="handleAuditSearch()" class="px-2.5 py-1.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-700 outline-none" title="Urutkan">
                            <option value="desc">Short</option>
                            <option value="asc">Terlama</option>
                        </select>

                        <!-- 3. Search -->
                        <div class="relative min-w-[180px] sm:min-w-[220px] max-w-xs flex-1">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400"></i>
                            <input id="audit-search-input" type="text" oninput="handleAuditSearch()" placeholder="Cari aksi, keterangan target, pengguna, atau IP..." class="w-full pl-9 pr-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none text-xs text-slate-800 transition">
                        </div>
                    </div>

                    <!-- Right: Toolbar Action Buttons (Icon Only with Tooltip) -->
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button type="button" onclick="loadAuditData()" class="btn-icon border border-slate-300 text-slate-700 hover:bg-slate-50 transition" title="Muat Ulang Log Audit">
                            <i class="fa-solid fa-rotate text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Audit Log Table with Pagination -->
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left text-xs border-collapse compact-table">
                            <thead class="bg-slate-100 uppercase font-bold text-slate-600 tracking-wider">
                                <tr>
                                    <th class="w-12 text-center">No</th>
                                    <th>Waktu</th>
                                    <th>Pengguna</th>
                                    <th>Aksi</th>
                                    <th>Target / Keterangan</th>
                                    <th>IP / Host</th>
                                </tr>
                            </thead>
                            <tbody id="audit-tbody" class="divide-y divide-slate-100">
                                <tr>
                                    <td colspan="6" class="p-8 text-center text-slate-400">
                                        <i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat log audit...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination Footer -->
                    <div class="px-4 py-3 bg-slate-50 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
                        <div id="audit-pagination-info" class="text-slate-500 font-medium">
                            Menampilkan 0 log
                        </div>
                        <div id="audit-pagination-buttons" class="flex items-center gap-1">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../assets/js/guru-core.js"></script>
    <script src="../assets/js/modular-nav.js"></script>
    <script>
        let allAuditLogs = [];
        let filteredAuditLogs = [];
        let auditPage = 1;
        let auditPerPage = 20;

        window.onDataLoaded = async () => {
            await loadAuditData();
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const ok = await checkServerSession(loadAuditData);
            if (ok) {
                await loadAuditData();
            }
        });

        async function loadAuditData() {
            await fetchDataFromAPI();
            allAuditLogs = (dbData.audit_logs || []).slice().reverse();
            handleAuditSearch();
        }

        function handleAuditSearch() {
            const q = (document.getElementById('audit-search-input')?.value || '').trim().toLowerCase();
            filteredAuditLogs = allAuditLogs.filter(l => {
                if (!q) return true;
                const isLegacyLoginGuru = l.action === 'Login guru' && (l.target === '::1' || /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(l.target));
                const ipStr = String(l.ip || (isLegacyLoginGuru ? l.target : '') || '').toLowerCase();
                const targetStr = String(isLegacyLoginGuru ? 'Dashboard Guru' : (l.target || '')).toLowerCase();
                return (
                    (l.action && l.action.toLowerCase().includes(q)) ||
                    (targetStr && targetStr.includes(q)) ||
                    (l.user && l.user.toLowerCase().includes(q)) ||
                    (ipStr && ipStr.includes(q)) ||
                    (l.detail && String(l.detail).toLowerCase().includes(q))
                );
            });

            const sortMode = document.getElementById('audit-sort')?.value || 'desc';
            filteredAuditLogs.sort((a, b) => {
                const tA = new Date(a.time || 0).getTime();
                const tB = new Date(b.time || 0).getTime();
                return sortMode === 'asc' ? tA - tB : tB - tA;
            });

            auditPage = 1;
            renderAuditTable();
        }

        function changeAuditPerPage(val) {
            auditPerPage = parseInt(val) || 20;
            auditPage = 1;
            renderAuditTable();
        }

        function renderAuditTable() {
            const tbody = document.getElementById('audit-tbody');
            const total = filteredAuditLogs.length;
            const totalPages = Math.ceil(total / auditPerPage) || 1;

            if (auditPage > totalPages) auditPage = totalPages;
            if (auditPage < 1) auditPage = 1;

            const startIdx = (auditPage - 1) * auditPerPage;
            const endIdx = Math.min(startIdx + auditPerPage, total);
            const pageData = filteredAuditLogs.slice(startIdx, endIdx);

            if (!total) {
                tbody.innerHTML = `
                    <tr><td colspan="6" class="p-8 text-center text-slate-400">Belum ada rekam log audit yang cocok.</td></tr>
                `;
            } else {
                tbody.innerHTML = pageData.map((l, idx) => {
                    const rowNumber = startIdx + idx + 1;
                    const dateFormatted = l.time ? new Date(l.time).toLocaleString('id-ID') : '-';
                    const isLegacyLoginGuru = l.action === 'Login guru' && (l.target === '::1' || /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(l.target));
                    let rawIp = l.ip || (isLegacyLoginGuru ? l.target : '') || (window.location.hostname || '127.0.0.1');
                    if (rawIp === '::1' || rawIp === 'localhost') rawIp = '127.0.0.1';
                    const targetDisplay = isLegacyLoginGuru ? 'Dashboard Guru' : (l.target || l.detail || '-');

                    return `
                        <tr class="hover:bg-slate-50 transition text-xs">
                            <td class="p-2.5 text-center font-bold text-slate-400">${rowNumber}</td>
                            <td class="p-2.5 text-slate-500 font-mono text-[11px] whitespace-nowrap">${dateFormatted}</td>
                            <td class="p-2.5 font-bold text-slate-700 whitespace-nowrap">
                                <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 font-mono text-[11px]">${escapeHtml(l.user || 'guru')}</span>
                            </td>
                            <td class="p-2.5 font-bold text-slate-800">${escapeHtml(l.action || '-')}</td>
                            <td class="p-2.5 text-slate-600 max-w-sm truncate" title="${escapeHtml(targetDisplay)}">${escapeHtml(targetDisplay)}</td>
                            <td class="p-2.5 font-mono text-[11px] whitespace-nowrap">
                                <span class="px-2 py-0.5 rounded-md bg-slate-100 border border-slate-200 text-slate-700 font-medium">${escapeHtml(rawIp)}</span>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            // Pagination Controls
            const info = document.getElementById('audit-pagination-info');
            const btns = document.getElementById('audit-pagination-buttons');

            if (!total) {
                info.innerText = 'Menampilkan 0 log';
                btns.innerHTML = '';
                return;
            }

            info.innerText = `Menampilkan ${startIdx + 1} - ${endIdx} dari ${total} log`;

            let html = `
                <button type="button" onclick="goToAuditPage(${auditPage - 1})" ${auditPage <= 1 ? 'disabled class="px-2.5 py-1 rounded-lg border border-slate-200 text-slate-300 cursor-not-allowed text-xs"' : 'class="px-2.5 py-1 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs transition"'}>
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= auditPage - 1 && i <= auditPage + 1)) {
                    const active = i === auditPage ? 'bg-brand-600 text-white font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-100';
                    html += `<button type="button" onclick="goToAuditPage(${i})" class="px-2.5 py-1 rounded-lg border text-xs transition ${active}">${i}</button>`;
                } else if (i === auditPage - 2 || i === auditPage + 2) {
                    html += `<span class="px-1 text-slate-400 text-xs">...</span>`;
                }
            }

            html += `
                <button type="button" onclick="goToAuditPage(${auditPage + 1})" ${auditPage >= totalPages ? 'disabled class="px-2.5 py-1 rounded-lg border border-slate-200 text-slate-300 cursor-not-allowed text-xs"' : 'class="px-2.5 py-1 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs transition"'}>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
            `;

            btns.innerHTML = html;
        }

        function goToAuditPage(p) {
            auditPage = p;
            renderAuditTable();
        }
    </script>
</body>
</html>
